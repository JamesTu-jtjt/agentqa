[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentqa"
version = "0.1.0"
description = "Executable evidence for metamorphic validation of agent repairs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentqa = "agentqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
